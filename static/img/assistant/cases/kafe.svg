<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="Сеть кафе: стойка, чашка и счёт закупок">
  <defs>
    <linearGradient id="bgK" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F7F5"/><stop offset="1" stop-color="#DBE9E4"/>
    </linearGradient>
    <clipPath id="barClip"><rect x="0" y="0" width="1200" height="322"/></clipPath>
  </defs>
  <rect width="1200" height="450" fill="url(#bgK)"/>
  <circle cx="1060" cy="90" r="170" fill="#2F8B78" opacity=".09"/>

  <!-- бариста за стойкой -->
  <g clip-path="url(#barClip)">
    <circle cx="300" cy="146" r="44" fill="#10463E"/>
    <rect x="287" y="184" width="26" height="24" fill="#10463E"/>
    <path d="M300 204c-58 0-94 36-98 130h196c-4-94-40-130-98-130z" fill="#1C6A5C"/>
    <path d="M378 284c34-8 56-28 66-62" stroke="#1C6A5C" stroke-width="19" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="120" y="314" width="520" height="18" rx="9" fill="#10463E"/>
  <rect x="140" y="332" width="480" height="96" fill="#10463E" opacity=".12"/>

  <!-- чашка -->
  <g transform="translate(470,228)">
    <path d="M-44 0h88v34c0 26-20 44-44 44S-44 60-44 34z" fill="#E9C46A"/>
    <path d="M44 8h14c14 0 22 10 22 22s-8 22-22 22H44" stroke="#E9C46A" stroke-width="12" fill="none"/>
    <path d="M-30-34c8-12 4-20-2-30M0-34c8-12 4-20-2-30M30-34c8-12 4-20-2-30" stroke="#2F8B78" stroke-width="8" stroke-linecap="round" fill="none" opacity=".8"/>
  </g>

  <!-- счёт закупок -->
  <g>
    <path d="M744 84h300v298l-30-22-30 22-30-22-30 22-30-22-30 22-30-22-30 22-30-22-30 22z" fill="#fff"/>
    <g fill="#10463E" opacity=".18">
      <rect x="784" y="132" width="146" height="15" rx="7"/><rect x="960" y="132" width="52" height="15" rx="7"/>
      <rect x="784" y="176" width="174" height="15" rx="7"/><rect x="976" y="176" width="36" height="15" rx="7"/>
      <rect x="784" y="220" width="122" height="15" rx="7"/><rect x="952" y="220" width="60" height="15" rx="7"/>
    </g>
    <rect x="784" y="268" width="228" height="18" rx="9" fill="#2F8B78" opacity=".55"/>
  </g>

  <!-- стрелка: перерасход пойман -->
  <g transform="translate(1040,286)">
    <circle r="54" fill="#E9C46A"/>
    <path d="M-20 16l18-26 14 14 16-26" stroke="#10463E" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M14-24h20v20" stroke="#10463E" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
